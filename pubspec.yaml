name: chainkey_workspace
description: Monorepo workspace for chainkey federated plugin.
publish_to: none

environment:
  sdk: ^3.5.0

workspace:
  - packages/chainkey
  - packages/chainkey/example
  - packages/chainkey_platform_interface
  - packages/chainkey_android
  - packages/chainkey_ios
  - packages/chainkey_web

dev_dependencies:
  melos: ^8.1.0
  pigeon: ^29.0.1

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze --fatal-infos
      description: Run flutter analyze across all packages.

    format:check:
      run: dart format --output=none --set-exit-if-changed .
      description: Check Dart code formatting across the repository.

    format:
      run: dart format .
      description: Format Dart code across the repository.

    test:
      run: melos exec --ignore="chainkey_web" --dir-exists="test" -- flutter test
      description: Run flutter test in all non-web packages with a test/ directory.

    test:web:
      run: melos exec --scope="chainkey_web" -- flutter test --platform chrome
      description: Run flutter web tests on chrome platform.

    test:coverage:
      run: melos exec --ignore="chainkey_web" --dir-exists="test" -- flutter test --coverage
      description: Run flutter test with coverage generation for non-web packages.

    pigeon:
      run: dart run pigeon --input pigeons/key_api.dart
      description: Regenerate type-safe Pigeon host and Dart bindings from pigeons/key_api.dart.
