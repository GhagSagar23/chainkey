name: chainkey_ios
description: iOS implementation of the chainkey plugin using Apple Secure Enclave, CryptoKit, and ASAuthorization.
version: 0.1.0
repository: https://github.com/GhagSagar23/chainkey/tree/master/packages/chainkey_ios
issue_tracker: https://github.com/GhagSagar23/chainkey/issues
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  chainkey_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: chainkey
    platforms:
      ios:
        pluginClass: ChainkeyIosPlugin
