name: chainkey_android
description: Android implementation of the chainkey plugin using StrongBox, AndroidKeyStore, and CredentialManager.
version: 0.1.0
repository: https://github.com/GhagSagar23/chainkey/tree/master/packages/chainkey_android
issue_tracker: https://github.com/GhagSagar23/chainkey/issues
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  chainkey_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: chainkey
    platforms:
      android:
        package: dev.chainkey.chainkey_android
        pluginClass: ChainkeyAndroidPlugin
