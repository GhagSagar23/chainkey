name: Feature Request
description: Suggest a new feature, hardware capability, or API improvement for chainkey
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea or improvement for `chainkey`!

  - type: dropdown
    id: package
    attributes:
      label: Target Package(s)
      description: Which package would this feature affect?
      multiple: true
      options:
        - "packages/chainkey (App-facing API)"
        - "packages/chainkey_platform_interface"
        - "packages/chainkey_android (Android Keystore / StrongBox)"
        - "packages/chainkey_ios (Apple Secure Enclave)"
        - "packages/chainkey_web (WebAuthn / Passkeys)"
        - "pigeons (Host API bindings)"
        - "All / Monorepo Architecture"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: "A clear and concise description of what the problem is. E.g., Currently when using ERC-4337 bundlers..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution you'd like to see and how developers would use it.
      placeholder: "Add `signUserOpHash(...)` method to Chainkey instance with optional biometric prompt customization..."
    validations:
      required: true

  - type: checkboxes
    id: hardware_scope
    attributes:
      label: Cryptographic & Hardware Scope
      description: Check all hardware and cryptographic components involved in this request.
      options:
        - label: Apple Secure Enclave (SEP)
        - label: Android StrongBox / TEE
        - label: W3C WebAuthn / Passkeys
        - label: EIP-7212 / ERC-4337 Account Abstraction
        - label: Hardware Attestation (X.509 / AppAttest)
        - label: BiometricPrompt / LocalAuthentication UX

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
      placeholder: "A clear description of alternative solutions or workarounds."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context & References
      description: Relevant EIPs, RFCs, Apple/Android documentation, or code examples.
      placeholder: "https://eips.ethereum.org/EIPS/eip-7212"
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a Pull Request for this feature.
          required: false
