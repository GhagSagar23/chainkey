name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish in dry-run mode'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for requesting the JWT for pub.dev OIDC
  contents: write # Required for creating GitHub Releases

jobs:
  publish:
    name: Publish Packages to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # Required for requesting the JWT for pub.dev OIDC
      contents: write # Required for creating GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Dart and OIDC for pub.dev
        uses: dart-lang/setup-dart@v1

      - name: Install Melos
        run: dart pub global activate melos

      - name: Melos Bootstrap
        run: melos bootstrap

      - name: Determine Publish Mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "FLAGS=--dry-run" >> "$GITHUB_ENV"
            echo "Publishing mode: DRY RUN"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
            echo "FLAGS=--force" >> "$GITHUB_ENV"
            echo "Publishing mode: PRODUCTION RELEASE (OIDC)"
          else
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "FLAGS=--dry-run" >> "$GITHUB_ENV"
            echo "Publishing mode: DRY RUN (default)"
          fi

      - name: Publish Packages (Ordered by Dependency)
        run: |
          set -e
          PACKAGES=(
            "packages/chainkey_platform_interface"
            "packages/chainkey_android"
            "packages/chainkey_ios"
            "packages/chainkey_web"
            "packages/chainkey"
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "=========================================="
            echo "Processing $pkg with flags: $FLAGS"
            echo "=========================================="
            (cd "$pkg" && dart pub publish $FLAGS)
          done

      - name: Create GitHub Release
        if: env.DRY_RUN == 'false' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
